<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Таймер события</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 28px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--tg-theme-bg-color, #0f172a);
      color: var(--tg-theme-text-color, #f8fafc);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: 100%; max-width: 520px; text-align: center; }
    h1 { margin: 0 0 12px; font-size: clamp(24px, 7vw, 32px); }
    .timer { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 32px 0; }
    .block { padding: 16px 4px; border-radius: 16px; background: var(--tg-theme-secondary-bg-color, #1e293b); }
    .value { font-size: clamp(28px, 9vw, 54px); font-weight: 700; font-variant-numeric: tabular-nums; }
    .label { margin-top: 6px; font-size: 12px; color: var(--tg-theme-hint-color, #94a3b8); }
    #status { min-height: 24px; line-height: 1.6; }
    #retry { padding: 12px 20px; border: 0; border-radius: 12px; background: var(--tg-theme-button-color, #3b82f6); color: var(--tg-theme-button-text-color, white); font: inherit; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>До события осталось</h1>
    <div class="timer" id="timer" hidden>
      <div class="block"><div class="value" id="days">0</div><div class="label">дней</div></div>
      <div class="block"><div class="value" id="hours">00</div><div class="label">часов</div></div>
      <div class="block"><div class="value" id="minutes">00</div><div class="label">минут</div></div>
      <div class="block"><div class="value" id="seconds">00</div><div class="label">секунд</div></div>
    </div>
    <p id="status" role="status">Загрузка таймера…</p>
    <button id="retry" type="button" hidden>Попробовать снова</button>
  </main>
  <script>
    const app = window.Telegram?.WebApp;
    app?.ready();
    app?.expand();

    const elements = Object.fromEntries(
      ['timer', 'status', 'retry', 'days', 'hours', 'minutes', 'seconds']
        .map(id => [id, document.getElementById(id)])
    );
    let targetTime = null;
    let timerInterval = null;

    function updateTimer() {
      if (targetTime === null) return;
      const remaining = Math.max(0, Math.floor((targetTime - Date.now()) / 1000));
      elements.days.textContent = String(Math.floor(remaining / 86400));
      elements.hours.textContent = String(Math.floor(remaining / 3600) % 24).padStart(2, '0');
      elements.minutes.textContent = String(Math.floor(remaining / 60) % 60).padStart(2, '0');
      elements.seconds.textContent = String(remaining % 60).padStart(2, '0');
      elements.status.textContent = targetTime <= Date.now() ? '🎉 Время наступило!' : '';
      if (targetTime <= Date.now()) clearInterval(timerInterval);
    }

    async function loadTimer() {
      clearInterval(timerInterval);
      targetTime = null;
      elements.timer.hidden = true;
      elements.retry.hidden = true;
      elements.status.textContent = 'Загрузка таймера…';
      try {
        // The bot and the page use the same config.json. Never fall back to an old date.
        const response = await fetch(new URL('config.json', window.location.href), {
          cache: 'no-store', signal: AbortSignal.timeout(10000)
        });
        if (!response.ok) throw new Error('Не удалось загрузить конфигурацию');
        const config = await response.json();
        if (typeof config.target !== 'string' || !/(Z|[+-]\d{2}:\d{2})$/.test(config.target)) {
          throw new Error('В дате отсутствует часовой пояс');
        }
        if (typeof config.timezone !== 'string' || !config.timezone) {
          throw new Error('Не указан часовой пояс');
        }
        const target = new Date(config.target);
        if (!Number.isFinite(target.getTime())) throw new Error('Некорректная дата');
        targetTime = target.getTime();
        elements.timer.hidden = false;
        if (targetTime > Date.now()) timerInterval = setInterval(updateTimer, 1000);
        updateTimer();
      } catch (error) {
        elements.status.textContent = 'Не удалось загрузить таймер. Проверьте соединение и попробуйте снова.';
        elements.retry.hidden = false;
      }
    }

    elements.retry.addEventListener('click', loadTimer);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) updateTimer();
    });
    loadTimer();
  </script>
</body>
</html>
